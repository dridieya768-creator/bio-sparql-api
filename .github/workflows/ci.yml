name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bio-sparql-api .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api bio-sparql-api
          for i in $(seq 1 15); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
